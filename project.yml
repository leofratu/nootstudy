name: IBVault
options:
  bundleIdPrefix: com.nootstudy
  deploymentTarget:
    macOS: "14.0"
schemes:
  IBVault:
    shared: true
    build:
      targets:
        IBVault: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IBVaultTests
targets:
  IBVault:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IBVault
        excludes:
          - Materials
      - path: IBVault/Materials
        type: folder
    info:
      path: Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSUserNotificationAlertStyle: "alert"
    entitlements:
      path: IBVault/IBVault.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: "" # Allows local build
      ENABLE_PREVIEWS: YES
      SDKROOT: macosx
      SUPPORTED_PLATFORMS: macosx
      SWIFT_VERSION: 5.0
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_BUNDLE_IDENTIFIER: com.nootstudy.ibvault.app
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 NootStudy. All rights reserved."
      INFOPLIST_KEY_NSPrincipalClass: NSApplication
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
  IBVaultTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IBVaultTests
    dependencies:
      - target: IBVault
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      SDKROOT: macosx
      SUPPORTED_PLATFORMS: macosx
      SWIFT_VERSION: 5.0
      PRODUCT_BUNDLE_IDENTIFIER: com.nootstudy.ibvault.tests
      ENABLE_TESTING_SEARCH_PATHS: YES
      GENERATE_INFOPLIST_FILE: YES
