name: IBVault
options:
  bundleIdPrefix: com.nootstudy
  deploymentTarget:
    macOS: "14.0"
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
  FSRS:
    url: https://github.com/open-spaced-repetition/swift-fsrs.git
    revision: 4fbaf20184d62f82a9f44f343337c61a2c5483e9
schemes:
  IBVault:
    shared: true
    build:
      targets:
        IBVault: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - IBVaultTests
targets:
  IBVault:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IBVault
        excludes:
          - Materials
      - path: IBVault/Materials
        type: folder
    dependencies:
      - package: ZIPFoundation
      - package: FSRS
    info:
      path: Info.plist
      properties:
        LSMinimumSystemVersion: "14.0"
        NSUserNotificationAlertStyle: "alert"
        NSCalendarsFullAccessUsageDescription: "Noot Study syncs your planned study sessions with the calendar you choose."
        # XcodeGen regenerates Info.plist from this block, so the version must
        # live here. Editing Info.plist directly is silently reverted by the
        # next `xcodegen generate`.
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "3"
    entitlements:
      path: IBVault/IBVault.entitlements
      properties:
        # Local Codex provider launches the user's authenticated Codex CLI.
        # Re-enable App Sandbox for a store build and ship that provider through
        # a separately signed helper/XPC service instead.
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: "" # Allows local build
      ENABLE_PREVIEWS: YES
      SDKROOT: macosx
      SUPPORTED_PLATFORMS: macosx
      SWIFT_VERSION: 6.0
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      OTHER_SWIFT_FLAGS: -Xfrontend -warn-long-expression-type-checking=800
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      PRODUCT_NAME: Noot Study
      PRODUCT_MODULE_NAME: IBVault
      PRODUCT_BUNDLE_IDENTIFIER: com.nootstudy.ibvault.app
      INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 NootStudy. All rights reserved."
      INFOPLIST_KEY_NSPrincipalClass: NSApplication
      INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
  IBVaultTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: IBVaultTests
    dependencies:
      - target: IBVault
    settings:
      CODE_SIGN_IDENTITY: "-"
      DEVELOPMENT_TEAM: ""
      SDKROOT: macosx
      SUPPORTED_PLATFORMS: macosx
      SWIFT_VERSION: 6.0
      SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
      SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
      SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: YES
      SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
      OTHER_SWIFT_FLAGS: -Xfrontend -warn-long-expression-type-checking=800
      PRODUCT_BUNDLE_IDENTIFIER: com.nootstudy.ibvault.tests
      TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Noot Study.app/Contents/MacOS/Noot Study"
      BUNDLE_LOADER: "$(TEST_HOST)"
      ENABLE_TESTING_SEARCH_PATHS: YES
      GENERATE_INFOPLIST_FILE: YES
