name: Biology final sidebar verification
on:
  push:
    branches: [tools/biology-visual-20260924]
    paths: ['.github/workflows/biology-visual-verification.yml']
permissions:
  contents: read
concurrency:
  group: biology-final-sidebar-verification
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c2aed9303338d716f27644c5696affb63bfa0b7e
          path: app
          persist-credentials: false
      - name: Prepare the reviewed design source
        working-directory: app
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git apply --check --exclude=IBVault/Engine/ReviewQueueManager.swift ../tools/.github/tools/queue_candidate.patch
          git apply --exclude=IBVault/Engine/ReviewQueueManager.swift ../tools/.github/tools/queue_candidate.patch
          python3 ../tools/.github/tools/finish_functional.py
          python3 ../tools/.github/tools/finalize_outline.py
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          brew install xcodegen
          xcodegen generate
          git diff --check
      - name: Run every native functional and unchanged performance assertion
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild test -project IBVault.xcodeproj -scheme IBVault -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/sidebar-build" -resultBundlePath "$RUNNER_TEMP/functional.xcresult" \
            -jobs 2 -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/functional.log"
      - name: Render every visual fixture including SL and HL bioenergetics
        if: always()
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild test -project IBVault.xcodeproj -scheme IBVaultVisual -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/sidebar-build" -resultBundlePath "$RUNNER_TEMP/visual.xcresult" \
            -jobs 2 -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/visual.log"
      - name: Preserve exact source and results
        if: always()
        working-directory: app
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/functional.xcresult" --format json > "$RUNNER_TEMP/functional-summary.json" || true
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/visual.xcresult" --format json > "$RUNNER_TEMP/visual-summary.json" || true
          git diff --binary > "$RUNNER_TEMP/final.patch"
          tar --exclude .git -cf "$RUNNER_TEMP/final-source.tar" .
          grep -E 'bench |refreshDueCards|error:|recorded an issue|failed after|Test run with' "$RUNNER_TEMP/functional.log" | tail -50 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-sidebar-evidence
          path: |
            ${{ runner.temp }}/functional.log
            ${{ runner.temp }}/functional-summary.json
            ${{ runner.temp }}/visual.log
            ${{ runner.temp }}/visual-summary.json
            ${{ runner.temp }}/final-source.tar
            ${{ runner.temp }}/final.patch
            app/docs/biology-coverage.json
            /tmp/nootstudy-snapshots
          retention-days: 14
