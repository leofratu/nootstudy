name: Biology continuation verification
on:
  push:
    branches: [tools/biology-visual-20260924]
    paths: ['.github/workflows/biology-visual-verification.yml']
permissions:
  contents: read
concurrency:
  group: biology-continuation-verification
  cancel-in-progress: true
jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: review-tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 4bf9d72d0063ab06b7502d36f664105227f1ce0b
          path: app
          persist-credentials: false
      - name: Apply isolated candidate without publishing application changes
        working-directory: app
        run: |
          set -euo pipefail
          git apply --check ../review-tools/.github/tools/queue_candidate.patch
          git apply ../review-tools/.github/tools/queue_candidate.patch
          git diff --check
      - name: Run all native functional and unchanged performance assertions
        working-directory: app
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          brew install xcodegen
          xcodegen generate
          xcodebuild test -project IBVault.xcodeproj -scheme IBVault -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/candidate-build" -resultBundlePath "$RUNNER_TEMP/candidate-tests.xcresult" \
            -jobs 2 -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/candidate-tests.log"
      - name: Record exact results
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/candidate-tests.xcresult" --format json > "$RUNNER_TEMP/candidate-summary.json" || true
          grep -E 'bench |refreshDueCards|error:|recorded an issue|failed after|Test run with' "$RUNNER_TEMP/candidate-tests.log" | tail -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: review-queue-candidate
          path: |
            ${{ runner.temp }}/candidate-tests.log
            ${{ runner.temp }}/candidate-summary.json
            ~/Library/Logs/DiagnosticReports/*.ips
          retention-days: 7
