name: mcp

on:
  push:
    branches: [main]
    paths:
      - "integrations/nootstudy-mcp/**"
      - ".github/workflows/mcp.yml"
  pull_request:
    paths:
      - "integrations/nootstudy-mcp/**"
      - ".github/workflows/mcp.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/nootstudy-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: integrations/nootstudy-mcp/package-lock.json
      - run: npm ci
      - run: npm test
