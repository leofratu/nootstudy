name: Biology reference audit
on:
  push:
    branches: [audit/biology-reference-2025]
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyMuPDF==1.26.4
      - name: Extract identifiers and level boundaries
        run: |
          python - <<'PY'
          import hashlib, json, re, urllib.request
          from pathlib import Path
          import pymupdf
          url = 'https://anatolia.edu.gr/images/highschool/IBDP/Biology%20Guide%202025.pdf'
          raw = urllib.request.urlopen(url, timeout=45).read()
          document = pymupdf.open(stream=raw, filetype='pdf')
          rows = {}
          level = 'core'
          for page in document:
              if not 39 <= page.number <= 112:
                  continue
              for line in page.get_text().splitlines():
                  line = line.strip()
                  if re.search(r'^SL and HL', line):
                      level = 'core'
                  if re.search(r'^Additional higher level', line):
                      level = 'hl'
                  match = re.match(r'^([ABCD][1-4]\.[1-3])\.(\d+)\s*[—–-]', line)
                  if match:
                      code, number = match.group(1), int(match.group(2))
                      row = rows.setdefault(code, {'core': [], 'hl': [], 'pdfPages': []})
                      row[level].append(number)
                      if page.number + 1 not in row['pdfPages']:
                          row['pdfPages'].append(page.number + 1)
          for code, row in rows.items():
              assert len(row['core'] + row['hl']) == len(set(row['core'] + row['hl'])), code
              assert sorted(row['core'] + row['hl']) == list(range(1, max(row['core'] + row['hl']) + 1)), code
          assert len(rows) == 40, len(rows)
          result = {'source': url, 'sha256': hashlib.sha256(raw).hexdigest(), 'firstAssessment': 2025, 'topics': rows}
          Path('biology-reference.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: biology-reference-identifiers
          path: biology-reference.json
          retention-days: 1
