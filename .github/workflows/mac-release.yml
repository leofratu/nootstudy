name: macOS Release

on:
  workflow_dispatch:

# Version releases are verified locally and may contain notes only. A tag push
# must not provision a hosted runner. This workflow is available only when
# a maintainer deliberately requests a separate hosted build.

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 16 (Swift 6)
        run: |
          XCODE=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build App
        run: |
          xcodebuild -project IBVault.xcodeproj -scheme IBVault -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Archive App
        run: |
          cd build/Build/Products/Release
          zip -r NootStudy-macOS.zip "Noot Study.app"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/Build/Products/Release/NootStudy-macOS.zip
