name: macOS Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      
      - name: Install XcodeGen
        run: brew install xcodegen
        
      - name: Generate Xcode Project
        run: xcodegen generate
        
      - name: Build App
        run: |
          xcodebuild -project IBVault.xcodeproj -scheme IBVault -configuration Release -derivedDataPath build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          
      - name: Archive App
        run: |
          cd build/Build/Products/Release
          zip -r IBVault-macOS.zip IBVault.app
          
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        with:
          files: build/Build/Products/Release/IBVault-macOS.zip
