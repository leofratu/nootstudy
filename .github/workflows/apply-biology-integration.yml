name: Apply Biology integration
on:
  push:
    branches: [tools/biology-integration-20260924]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biology-curriculum-and-reliability
          fetch-depth: 0
      - name: Check the exact owned base
        run: |
          test "$(git rev-parse HEAD)" = e959bbc7bfeb306e1169d4afa8c86caf6fe0b4b1
          test -z "$(git status --porcelain)"
      - name: Apply reviewed surgical changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              assert text.count(old) == count, (path, old[:80], text.count(old), count)
              p.write_text(text.replace(old, new))
          p = Path('IBVault/Services/SyllabusSeeder.swift')
          text = p.read_text()
          text = text.replace('self = rawValue.uppercased()', 'self = rawValue.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()')
          assert text.count('switch subjectName {') == 2
          text = text.replace('switch subjectName {', 'switch subjectName.trimmingCharacters(in: .whitespacesAndNewlines).lowercased() {')
          for name in ['English B', 'Russian A Literature', 'Biology', 'Mathematics AA', 'Economics', 'Business Management', 'Advanced Mathematics', 'Fundamentals of the Universe']:
              text = text.replace('case "' + name + '"', 'case "' + name.lower() + '"')
          text = text.replace('case lifeCourseName', 'case "life"')
          text = text.replace('case "Founder Academy", "Startups & Venture Capital"', 'case "founder academy", "startups & venture capital"')
          text = text.replace('case "life", "Founder Academy", "Startups & Venture Capital"', 'case "life", "founder academy", "startups & venture capital"')
          start = text.index('    private static var biologyCurriculum:')
          end = text.index('    private static var mathAACurriculum:', start)
          text = text[:start] + '    private static var biologyCurriculum: [CurriculumUnit] { BiologyStudyService.curriculum }\n\n    // MARK: - Mathematics: Analysis and Approaches\n\n' + text[end:]
          p.write_text(text)
          edit(str(p), '''            return metadata(
                          firstAssessment: "2025",
                          title: "IB Diploma Programme Biology",
                          path: "programmes/diploma-programme/curriculum/sciences/biology/"
                      )'''.replace('              ', '  '), '''            return CurriculumMetadata(
                          catalogVersion: BiologyCatalog.version,
                          firstAssessment: "2025",
                          sourceTitle: "IB Diploma Programme Biology",
                          sourceURL: URL(string: BiologyCatalog.sourceURL) ?? URL(fileURLWithPath: "/")
                      )'''.replace('              ', '  '))
          PY
      - name: Preserve progress and close level-gating gaps
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def edit(path, old, new, count=1):
              p = Path(path); text = p.read_text()
              assert text.count(old) == count, (path, old[:80], text.count(old), count)
              p.write_text(text.replace(old, new))
          seeder = 'IBVault/Services/SyllabusSeeder.swift'
          edit(seeder, '        var nodesByKey: [String: CurriculumNode] = [:]\n        for node in existingNodes {', '''        // A damaged bundle must not be mistaken for a deliberately empty syllabus.
                  if subjects.contains(where: { $0.name.trimmingCharacters(in: .whitespacesAndNewlines).lowercased() == "biology" }),
                     BiologyCatalog.failure != nil { return false }
                  var nodesByKey: [String: CurriculumNode] = [:]
                  // Keep the newest recorded evidence, not an arbitrary fetch-order row.
                  let orderedNodes = existingNodes.sorted {
                      if $0.hasRecordedEvidence != $1.hasRecordedEvidence { return $0.hasRecordedEvidence }
                      let left = $0.masteryUpdatedAt ?? $0.updatedAt
                      let right = $1.masteryUpdatedAt ?? $1.updatedAt
                      if left != right { return left > right }
                      return $0.id.uuidString < $1.id.uuidString
                  }
                  for node in orderedNodes {'''.replace('          ', ''))
          edit(seeder, 'for (key, node) in nodesByKey where !expectedKeys.contains(key) {', 'for (key, node) in nodesByKey where !expectedKeys.contains(key) && !node.hasRecordedEvidence {')
          edit('IBVault/Models/CurriculumNode.swift', '    var stableKey: String {', '''    /// Retired or other-level records with evidence are user data, not disposable catalog rows.
              var hasRecordedEvidence: Bool {
                  recordedMasteryRaw != nil || masteryUpdatedAt != nil || masterySource != nil || masteryNote != nil
              }

              var stableKey: String {'''.replace('          ', ''))
          proficiency = 'IBVault/Engine/ProficiencyTracker.swift'
          edit(proficiency, 'let reviewCount = card.totalReviewCount', 'let reviewCount = card.successfulReviewCount // Failed attempts alone are not evidence of learning.')
          edit(proficiency, 'calculateMastery(for: subject.cards)', 'calculateMastery(for: subject.cards.filter(BiologyStudyService.isEligible))')
          queue = 'IBVault/Engine/ReviewQueueManager.swift'
          edit(queue, 'for card in candidates {', 'for card in candidates where BiologyStudyService.isEligible(card) {')
          edit(queue, 'remaining > 0 && !reviewedCanonicalIDs.contains', 'BiologyStudyService.isEligible(card) && remaining > 0 && !reviewedCanonicalIDs.contains')
          edit(queue, 'let library = CardDuplicatePolicy.library(all)', 'let library = CardDuplicatePolicy.library(all.filter(BiologyStudyService.isEligible))')
          edit(queue, 'return CardDuplicatePolicy.library(cards).cards', 'return CardDuplicatePolicy.library(cards.filter(BiologyStudyService.isEligible)).cards')
          edit('IBVault/Models/Subject.swift', 'return cards.filter { $0.nextReviewDate <= now }.count', 'return cards.filter { BiologyStudyService.isEligible($0) && $0.nextReviewDate <= now }.count')
          edit('IBVault/Models/Subject.swift', 'for card in cards {', 'for card in cards where BiologyStudyService.isEligible(card) {')
          scheduler = 'IBVault/Engine/ReviewScheduler.swift'
          edit(scheduler, '            return subject.cards\n', '            return subject.cards.filter(BiologyStudyService.isEligible)\n')
          edit(scheduler, '            subjectScopes.contains { $0.matches(card) }', '            BiologyStudyService.isEligible(card) && subjectScopes.contains { $0.matches(card) }')
          review = 'IBVault/Views/Review/ReviewSessionView.swift'
          edit(review, '        .onAppear { loadCards() }', '        .onAppear { loadCards() }\n        .onChange(of: currentCard?.subject?.level) { _, _ in loadCards() }')
          recall = 'IBVault/Views/Review/RecallCardView.swift'
          edit(recall, '        .onChange(of: card.id) { _, _ in resetChoices() }', '        .onChange(of: card.id) { _, _ in resetChoices() }\n        .onChange(of: revealed) { _, value in if !value { resetChoices() } }')
          edit(recall, '                FormattedMessageContent(text: card.back).textSelection(.enabled)', '''                FormattedMessageContent(text: card.back).textSelection(.enabled)
                          if let explanation = BiologyStudyService.explanation(for: card) {
                              Text(explanation).font(.callout).foregroundStyle(IBColors.inkSecondary).textSelection(.enabled)
                          }'''.replace('          ', ''))
          browser = 'IBVault/Views/Subjects/TopicBrowserView.swift'
          edit(browser, '    var body: some View {\n        VStack(spacing: 0) {', '''    @ViewBuilder var body: some View {
                  if subject.name.trimmingCharacters(in: .whitespacesAndNewlines).lowercased() == "biology" {
                      BiologyStudyView(subject: subject)
                  } else {
                      legacyBrowser
                  }
              }

              private var legacyBrowser: some View {
                  VStack(spacing: 0) {'''.replace('          ', ''))
          edit(browser, '        .onChange(of: searchText) { _, _ in synchronizeSelection() }', '        .onChange(of: searchText) { _, _ in synchronizeSelection() }\n        .onChange(of: subject.level) { _, _ in synchronizeSelection() }')
          edit(browser, '        let mastery = ProficiencyTracker.masteryPercentage(for: cards)', '''        let recorded = CurriculumProgressService.node(in: nodes, subjectName: subject.name,
                      level: subject.level, topicName: topic, subtopicName: subtopic)
                  let mastery = CurriculumProgressService.effectiveMastery(cards: cards, node: recorded)'''.replace('          ', ''))
          edit(browser, 'let hasProgress = count > 0 || !workSessions.isEmpty', 'let hasProgress = mastery >= 1 // Creating cards or opening a session is not completion.')
          edit(browser, '                    if count > 0 {', '                    if count > 0 || recorded?.recordedProficiency != nil {')
          edit('IBVaultTests/SyllabusSeederTests.swift', '#expect(biology.contains { $0.name == "Higher Level Extension" })', '#expect(biology.flatMap(\\.topics).contains { $0.name == "A2.3 Viruses" })')
          PY
      - name: Verify and generate review artifacts
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          python3 scripts/audit_biology.py --output docs/biology-coverage.json
          git diff --check
          git diff --stat
          git diff -- IBVault/Services/SyllabusSeeder.swift IBVault/Models/CurriculumNode.swift IBVault/Engine IBVault/Views/Subjects/TopicBrowserView.swift IBVault/Views/Review IBVaultTests/SyllabusSeederTests.swift
      - name: Commit only the reviewed files and push without force
        run: |
          set -euo pipefail
          git config user.name 'Leo Fratu'
          git config user.email '181772404+leofratu@users.noreply.github.com'
          git add IBVault/Services/SyllabusSeeder.swift IBVault/Models/CurriculumNode.swift IBVault/Models/Subject.swift IBVault/Engine/ProficiencyTracker.swift IBVault/Engine/ReviewQueueManager.swift IBVault/Engine/ReviewScheduler.swift IBVault/Views/Review/ReviewSessionView.swift IBVault/Views/Review/RecallCardView.swift IBVault/Views/Subjects/TopicBrowserView.swift IBVaultTests/SyllabusSeederTests.swift IBVault.xcodeproj/project.pbxproj docs/biology-coverage.json
          git commit -m 'fix: preserve curriculum evidence, gate Biology review levels and activate offline study'
          git push origin HEAD:fix/biology-curriculum-and-reliability
          git archive --format=tar HEAD > "$RUNNER_TEMP/integrated-source.tar"
      - name: Select Xcode and run relevant regressions
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_26*.app' | sort | tail -n 1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild test -project IBVault.xcodeproj -scheme IBVault -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/biology-build" -resultBundlePath "$RUNNER_TEMP/biology-tests.xcresult" \
            -jobs 2 -parallel-testing-enabled NO \
            -only-testing:IBVaultTests/BiologyCurriculumTests -only-testing:IBVaultTests/SyllabusSeederTests \
            -only-testing:IBVaultTests/ReviewQueueManagerTests -only-testing:IBVaultTests/ProficiencyTrackerTests \
            -only-testing:IBVaultTests/FSRSSchedulerTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            | tee "$RUNNER_TEMP/biology-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biology-integration-evidence
          path: |
            ${{ runner.temp }}/biology-tests.log
            ${{ runner.temp }}/biology-tests.xcresult
            ${{ runner.temp }}/integrated-source.tar
            docs/biology-coverage.json
          retention-days: 7
