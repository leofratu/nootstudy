name: Apply Biology integration
on:
  push:
    branches: [tools/biology-integration-20260924]
permissions:
  contents: write
concurrency:
  group: biology-integration
  cancel-in-progress: true
jobs:
  integrate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: integration-tools
      - uses: actions/checkout@v4
        with:
          ref: fix/biology-curriculum-and-reliability
          fetch-depth: 0
          path: app
      - name: Apply locally verified integration
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = e959bbc7bfeb306e1169d4afa8c86caf6fe0b4b1
          test -z "$(git status --porcelain)"
          python3 ../integration-tools/.github/tools/apply_biology.py
          test -d /Applications/Xcode_26.4.app/Contents/Developer
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks
          brew install xcodegen
          xcodegen generate
          python3 scripts/audit_biology.py --output docs/biology-coverage.json
          git diff --check
          git diff --stat
          git diff -- IBVault/Services/SyllabusSeeder.swift IBVault/Models/CurriculumNode.swift IBVault/Models/Subject.swift IBVault/Engine IBVault/Views/Subjects/TopicBrowserView.swift IBVault/Views/Review IBVaultTests/SyllabusSeederTests.swift .github/workflows/study-validation.yml
      - name: Commit reviewed files without rewriting history
        working-directory: app
        run: |
          set -euo pipefail
          git config user.name 'Leo Fratu'
          git config user.email '181772404+leofratu@users.noreply.github.com'
          git add IBVault/Services/SyllabusSeeder.swift IBVault/Models/CurriculumNode.swift IBVault/Models/Subject.swift IBVault/Engine/ProficiencyTracker.swift IBVault/Engine/ReviewQueueManager.swift IBVault/Engine/ReviewScheduler.swift IBVault/Views/Review/ReviewSessionView.swift IBVault/Views/Review/RecallCardView.swift IBVault/Views/Subjects/TopicBrowserView.swift IBVaultTests/SyllabusSeederTests.swift IBVault.xcodeproj/project.pbxproj docs/biology-coverage.json .github/workflows/study-validation.yml
          git commit -m 'fix: preserve curriculum evidence, gate Biology review levels and activate offline study'
          git push origin HEAD:fix/biology-curriculum-and-reliability
          git archive --format=tar HEAD > "$RUNNER_TEMP/integrated-source.tar"
      - name: Build and run focused regressions
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild test -project IBVault.xcodeproj -scheme IBVault -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/biology-build" -resultBundlePath "$RUNNER_TEMP/biology-tests.xcresult" \
            -jobs 2 -parallel-testing-enabled NO \
            -only-testing:IBVaultTests/BiologyCurriculumTests -only-testing:IBVaultTests/SyllabusSeederTests \
            -only-testing:IBVaultTests/ReviewQueueManagerTests -only-testing:IBVaultTests/ProficiencyTrackerTests \
            -only-testing:IBVaultTests/FSRSSchedulerTests \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/biology-tests.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biology-integration-evidence
          path: |
            ${{ runner.temp }}/biology-tests.log
            ${{ runner.temp }}/biology-tests.xcresult
            ${{ runner.temp }}/integrated-source.tar
            app/docs/biology-coverage.json
          retention-days: 7
