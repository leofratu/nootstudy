name: Biology integration verification
on:
  push:
    branches: [tools/biology-integration-20260924]
permissions:
  contents: write
concurrency:
  group: biology-integration
  cancel-in-progress: true
jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/biology-curriculum-and-reliability
          fetch-depth: 0
      - name: Apply reviewed binding fix
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = ca8bd0ddc2182880271ed39483a29eaf36e4c3b7
          test -z "$(git status --porcelain)"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('IBVault/Views/Subjects/BiologyStudyView.swift')
          text = p.read_text()
          old = 'Binding(get: { level }, set: changeLevel)'
          assert text.count(old) == 1
          p.write_text(text.replace(old, 'Binding(get: { level }, set: { changeLevel($0) })'))
          PY
          git diff --check
          git diff
          git config user.name 'Leo Fratu'
          git config user.email '181772404+leofratu@users.noreply.github.com'
          git add IBVault/Views/Subjects/BiologyStudyView.swift
          git commit -m 'fix: use an explicit level binding closure to avoid Swift compiler crash'
          git push origin HEAD:fix/biology-curriculum-and-reliability
          git archive --format=tar HEAD > "$RUNNER_TEMP/integrated-source.tar"
      - name: Build and run regressions on the installed SDK
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_26.4.app/Contents/Developer
          brew install xcodegen
          xcodegen generate
          python3 scripts/audit_biology.py --output "$RUNNER_TEMP/biology-coverage.json"
          xcodebuild test -project IBVault.xcodeproj -scheme IBVault -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/biology-build" -resultBundlePath "$RUNNER_TEMP/biology-tests.xcresult" \
            -jobs 2 -parallel-testing-enabled NO \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$RUNNER_TEMP/biology-tests.log"
      - name: Extract test summary
        if: always()
        run: |
          xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/biology-tests.xcresult" --format json > "$RUNNER_TEMP/test-summary.json" || true
          grep -E 'error:|failed|passed|Test run with|Testing failed' "$RUNNER_TEMP/biology-tests.log" | tail -80 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biology-integration-evidence
          path: |
            ${{ runner.temp }}/biology-tests.log
            ${{ runner.temp }}/biology-tests.xcresult
            ${{ runner.temp }}/test-summary.json
            ${{ runner.temp }}/integrated-source.tar
            ${{ runner.temp }}/biology-coverage.json
          retention-days: 7
